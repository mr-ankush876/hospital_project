# Production Profile (MySQL Database)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitalsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Disable H2 Console in Production
spring.h2.console.enabled=false

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable automatic seed initialization in production
spring.sql.init.mode=never

# Production CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hospital-project-omega-eight.vercel.app}
