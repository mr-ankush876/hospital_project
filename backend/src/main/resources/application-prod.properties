# Production Profile (MySQL Database) - Strict Fail-Fast: No localhost fallback
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Disable H2 Console in Production
spring.h2.console.enabled=false

# JPA / Hibernate Config - Production Safe (never create or create-drop)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable automatic seed initialization in production
spring.sql.init.mode=never
app.seed-data.enabled=false

# Production CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hospital-project-omega-eight.vercel.app}

