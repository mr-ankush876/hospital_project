# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitalsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ankush143@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable SQL script initialization (DataInitializer handles seeding)
spring.sql.init.mode=never
app.seed-data.enabled=${APP_SEED_DATA_ENABLED:false}

# Disable H2 console when using MySQL
spring.h2.console.enabled=false

