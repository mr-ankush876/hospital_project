# Spring Boot Configuration - VitalSync HMS
spring.application.name=vitalsync-hms
server.port=${PORT:8080}

# Active Profile (MySQL database as primary source of truth)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Common Security / JWT Configuration
jwt.secret=${JWT_SECRET:vitalsync_hms_super_secret_jwt_key_2026_clinical_precision_security_token_987654321}
jwt.expiration=86400000

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,https://hospital-project-omega-eight.vercel.app}

# Administrator Master Credentials
app.admin.username=${ADMIN_USERNAME:ankush_876}
app.admin.password=${ADMIN_PASSWORD:Ankush143@}

# Data Seeding Guard: strictly false by default in production
app.seed-data.enabled=${APP_SEED_DATA_ENABLED:false}

# Spring Boot Actuator Health Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Notification Provider Configuration
app.notification.sms.provider=${SMS_PROVIDER:TEST_SIMULATOR}
app.notification.sms.api-key=${SMS_API_KEY:}
app.notification.whatsapp.provider=${WHATSAPP_PROVIDER:TEST_SIMULATOR}
app.notification.whatsapp.api-key=${WHATSAPP_API_KEY:}


