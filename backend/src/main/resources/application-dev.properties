# Development Profile (H2 File Persistence - data saved permanently in ./data/vitalsyncdb)
spring.datasource.url=jdbc:h2:file:./data/vitalsyncdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable demo seed data in development/test profile
app.seed-data.enabled=true
spring.sql.init.mode=never

