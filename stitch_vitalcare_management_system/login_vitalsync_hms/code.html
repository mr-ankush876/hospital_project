<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased p-container-padding-mobile md:p-container-padding-desktop">
<main class="w-full max-w-md bg-surface-container-lowest border border-surface-variant shadow-sm rounded-xl p-8 flex flex-col items-center">
<header class="flex flex-col items-center mb-8 w-full text-center">
<img alt="VitalSync HMS Logo" class="w-20 h-20 mb-4 object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIlujlAmy3j48WClI6CXLPGDgxTe9fDfDBA4P3FGoLk6oTK-uQJngq7rpY_aN_OHI90PkmEdUkz-F8RzRvh7-5auuvjqd6-osxiBKw7fS3k1HxRkG3qSpqntLJbg7DbMN1365C39UFFI7hRSLmPSdvNmYvvmhf2OIfUE6t2-n8r7bd73KvXwhyx0Dw-yUeIP4bHHjkhfy4mj53lcK3ToUUIqUOxt1oXqcyKvFy06KJTGxf1Y8sqve6"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">VitalSync HMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back, please login to your account</p>
</header>
<form class="w-full flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface uppercase" for="email">Email or Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="email" name="email" placeholder="Enter your email or username" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="password" name="password" placeholder="Enter your password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" id="togglePasswordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between w-full">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-lowest cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-md text-body-md text-primary font-semibold hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-headline-md text-headline-md text-base hover:bg-primary-container focus:outline-none focus:ring-4 focus:ring-primary/20 transition-all shadow-sm" type="submit">
                Login
            </button>
</form>
<footer class="mt-8 text-center w-full">
<p class="font-label-md text-label-md text-on-surface-variant uppercase">Secure access managed by VitalSync Systems</p>
</footer>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const toggleButton = passwordInput.nextElementSibling;
            const toggleIcon = document.getElementById('togglePasswordIcon');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
</body></html>
